<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-tools" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-tools)"/>
  <!-- Scissors crossed with comb -->
  <g transform="translate(180, 80)">
    <!-- Scissors -->
    <path d="M60 40 L180 200 M180 40 L60 200" stroke="#d4d4d8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="50" cy="30" r="18" fill="none" stroke="#c2410c" stroke-width="6"/>
    <circle cx="190" cy="30" r="18" fill="none" stroke="#c2410c" stroke-width="6"/>
    <circle cx="120" cy="120" r="6" fill="#ea580c"/>
  </g>
